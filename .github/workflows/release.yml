name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.1)'
        required: true

permissions:
  contents: write

jobs:
  release-mac:
    name: Build macOS DMG
    # macos-15 (arm64) statt macos-latest: macos-latest zeigt inzwischen auf
    # macOS 26, wo electron-builder 24.x beim Signieren am Keychain scheitert
    # (`security set-key-partition-list` → "SecKeychainUnlock: passphrase not
    # correct"). macos-15 ist das aktuell aktive, ältere arm64-Image — macos-14
    # ist bei GitHub inzwischen in Retirement ("not supported"), macos-13 (Intel)
    # seit Dez 2025 abgeschaltet.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          CI: true

      - name: Package macOS app (signed + notarized)
        # Signs with the Developer ID cert from CSC_LINK and notarizes via
        # notarytool using the APPLE_* credentials. Produces a signed,
        # notarized DMG + ZIP under dist/.
        # main MUST be public/electron.js: that file is what ends up under
        # Resources/app/ in the bundle. Pointing main at build/electron.js
        # makes electron-builder look for an entry file that never gets
        # packaged there ("Application entry file ... does not exist").
        # --publish never: Mit der publish-Config (GitHub) in package.json würde
        # electron-builder bei einem Tag + vorhandenem GH_TOKEN sonst selbst ein
        # Release anlegen/hochladen und damit den Draft-Flow unten umgehen.
        # "never" erzeugt latest-mac.yml (Update-Manifest) trotzdem lokal in dist/,
        # lädt aber nichts hoch — das macht der action-gh-release-Step (als Draft).
        run: npx electron-builder --mac --publish never -c.extraMetadata.main=public/electron.js
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Starttest der gepackten App
        # Vor dem Release (#135): die signierte App starten, einen Eintrag
        # anlegen, neu starten, Eintrag ist noch da. Schlägt das fehl, entsteht
        # kein Release.
        run: npm run smoke

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
          retention-days: 30

      - name: Create GitHub Release
        # Auch bei workflow_dispatch anlegen (nicht nur bei Tag-Push), damit ein
        # Release für ein bereits existierendes Tag neu gebaut werden kann (z. B.
        # nach einem Runner-/CI-Fix), ohne den Tag löschen/neu pushen zu müssen.
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # Bei Tag-Push leer -> fällt auf github.ref_name (= Tag) zurück; bei
          # workflow_dispatch das übergebene Tag, da github.ref_name dort der
          # Branch wäre.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          # Installations-Anleitung (#22). Wird vor die automatisch generierten
          # Release-Notes gestellt. Nur der mac-Job setzt den Text; der
          # Windows-Job hängt anschließend nur Dateien an.
          body: |
            <div align="center">

            **CollectODex** – die Desktop-App für deine Pokémon-Kartensammlung.
            🌐 [Landingpage](https://r0cketbean.github.io/collectodex/) · 📖 [README](https://github.com/R0cketBean/collectodex#readme)

            </div>

            ## ⬇️ Installation

            **macOS** (signiert & notarisiert)
            1. Die `.dmg` öffnen.
            2. CollectODex in den Ordner „Programme" ziehen.

            **Windows** (NSIS-Installer, unsigniert)
            1. Die `…Setup.exe` ausführen.
            2. Falls SmartScreen warnt: „Weitere Informationen" → „Trotzdem ausführen".

            ---
          # latest-mac.yml + Blockmap sind nötig, damit electron-updater im
          # veröffentlichten Release das Update-Manifest findet (#20).
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap

  release-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    # Wartet auf den mac-Job, damit dieser das Draft-Release (per Tag) zuerst
    # anlegt; der Windows-Job hängt danach nur seine Dateien an (vermeidet eine
    # Race-Condition beim parallelen Erstellen desselben Releases).
    needs: release-mac
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          CI: true

      - name: Package Windows app (NSIS, unsigned)
        # shell: bash — der Default-Shell auf windows-latest ist PowerShell, die
        # das Argument -c.extraMetadata.main=public/electron.js zerlegt, sodass
        # electron-builder ".extraMetadata.main=..." als (nicht existierende)
        # Config-Datei öffnet (ENOENT). Unter Git Bash wird der dotted-Override
        # exakt wie im mac-Job geparst.
        # Unsigniert (keine CSC-Secrets) — SmartScreen-Hinweis steht im
        # Release-Text. --publish never erzeugt latest.yml (Update-Manifest für
        # Windows-Auto-Update, #20) lokal in dist/, lädt aber nichts selbst hoch;
        # das Anhängen ans Release macht der Schritt unten.
        shell: bash
        run: npx electron-builder --win --publish never -c.extraMetadata.main=public/electron.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Starttest der gepackten App
        # Wie im mac-Job (#135), gegen dist/win-unpacked.
        run: npm run smoke

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          retention-days: 30

      - name: Attach Windows artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Kein body/generate_release_notes hier — der mac-Job hat das Release
          # bereits mit Text angelegt; dieser Schritt hängt nur Dateien an.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
